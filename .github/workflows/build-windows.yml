name: Build Windows VST3 + Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows 10 / 11 (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DVOCOMAX_BUILD_DSP_TESTS=ON

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel 4

      - name: DSP checks
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check plugin output
        shell: pwsh
        run: |
          $vst = "build/VocaMaxSpace2_artefacts/Release/VST3/VocaMax Space 2.vst3"
          $exe = "build/VocaMaxSpace2_artefacts/Release/Standalone/VocaMax Space 2.exe"
          if (-not (Test-Path $vst)) { throw "VST3 missing: $vst" }
          if (-not (Test-Path $exe)) { throw "Standalone missing: $exe" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          & $iscc "installer/VocaMaxSpace2.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload installer + plugin
        uses: actions/upload-artifact@v4
        with:
          name: VocaMaxSpace2-Windows-x64
          path: |
            dist/VocaMaxSpace2_Setup.exe
            build/VocaMaxSpace2_artefacts/Release/VST3/VocaMax Space 2.vst3
            build/VocaMaxSpace2_artefacts/Release/Standalone/VocaMax Space 2.exe
          if-no-files-found: error
